# The numbers the API owns. The sending window and ramp are the sender's (outreach/sending/config.toml);
# the API reads them there and keeps no copy.

[notes]
max_chars = 300          # a LinkedIn note on his Premium seat (#9); the checks read the plan's note.max_chars

[outcomes]
min_requests = 30        # a period with fewer requests is "not enough yet"
finding_group_min = 20   # each side of a finding needs this many requests
prompt_after_days = 7    # ask about a touch once it is this old
reask_after_days = 7     # after "Nothing yet", ask once more this many days later
quiet_after_days = 21    # then the touch is marked quiet

[search]
index_top = 3000         # companies outside the browser index are found with a server search

[today]
linkedin_per_day = 7     # LinkedIn requests a day (#9); the lean Today adds the sender's email slots to it
proposals_per_slot = 2   # the lean Today proposes this many companies for each slot of its capacity
# Whether the lean Today builds a list on its first weekday read. Off: the plan job (#15, 08:00) builds the day, and a
# list built here first would make it stop with "already built" and leave no people plan for that date.
lean_build = false

[api]
# The heavy read views (shell, plan, bench, needs you, progress, wins, watch, the outcome prompt, the search index,
# LinkedIn and the Outbox list) keep their answer for one store version, one New York day and one slice of the clock
# this many seconds long. A write anywhere (this API, the sender, the crawler, the MCP server, a job) makes the next
# read compute afresh; this is also the oldest an answer can be.
cache_seconds = 15
max_heavy = 3            # heavy views computed at the same time; the rest wait their turn
queue_wait_seconds = 25  # a read that waited this long answers 503 busy (the page's own timeout is longer)
