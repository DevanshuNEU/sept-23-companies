# The crawler's numbers (issue #21). Loaded by config.py, which refuses values outside the ranges it checks.

# How often a board is read: its next read is due after (age / age_divisor) seconds, kept between the floor and
# the ceiling.
floor_s = 21600
ceiling_s = 604800
age_divisor = 8
# A board deferred by the breaker or the tick budget is due again after this many seconds.
defer_s = 1800
# An outage shields a board (its error, or a mass empty, is held as a deferral) only while its last read is younger
# than this. After that the read is written as it is, so a host that blocks for good still reaches Needs you.
outage_grace_s = 86400
# Check now (#194): seconds one run may take before it stops reading boards (60 to 3600). A check whose progress row
# has no end and is older than this plus 300 seconds is stale, so a new click can start another.
check_budget_s = 900
# A Check now skips a board read in the last this many seconds, and reads every active board of these ATSs (then the
# boards due on the other ATSs).
check_skip_recent_s = 60
check_ats = ["greenhouse", "ashby"]

# The declared User-Agent: no contact address, no URL. Equal to outreach.net.USER_AGENT.
user_agent = "outreach-crawler/1.0 (personal job search)"
timeout_s = 30
max_bytes = 20000000
max_redirects = 3

# Seconds between two requests to one host bucket; a bucket is the longest suffix below that matches the host.
default_host_interval_s = 1.0
# Buckets below whose hosts are spaced one by one: each tenant is its own server, so tenants do not wait on each other.
# The breaker still counts failures per bucket. Every entry must be a [host_interval_s] key.
split_hosts = ["myworkdayjobs.com", "oraclecloud.com", "bamboohr.com", "breezy.hr", "teamtailor.com", "recruitee.com",
               "applytojob.com"]
# Failures in a row on one bucket before the breaker opens.
breaker_failures = 5

# Rows per write batch (2,000 to 5,000), postings decided per batch, detail requests per read.
batch_rows = 2000
decide_batch = 100
detail_per_read = 150

# One tick: boards started at most, seconds of budget before no new board starts, top companies read first.
boards_per_tick = 1500  # #251: room for the 15 minute tier (was 500)
tick_budget_s = 1500
top_companies = 300

# Watched careers pages: seconds between reads of one page, pages per tick, text shorter than this is unreadable.
watch_interval_s = 604800
watch_per_tick = 40
watch_min_text_chars = 200

# A posting older than this many months is stale (1 to 60). Never a hide and never a close.
stale_after_months = 12

# A level-fit engineering posting's body is fetched again after this many days (ruling 6).
body_refetch_days = 30

[host_interval_s]
"greenhouse.io" = 0.05
"lever.co" = 1.0
"ashbyhq.com" = 0.1
"smartrecruiters.com" = 0.2
"workable.com" = 2.0
"rippling.com" = 0.5
"bamboohr.com" = 1.0
"breezy.hr" = 1.0
"pinpointhq.com" = 0.5
"teamtailor.com" = 0.5
"recruitee.com" = 0.5
"applytojob.com" = 2.0
"myworkdayjobs.com" = 1.0
"oraclecloud.com" = 1.0
"amazon.jobs" = 1.0
# Eightfold answers 429 and trips the breaker at 1 a second (#248, 2026-11-12: Applied Materials after about 100
# pages, Micron's detail requests): 3 seconds, on its own host and on each tenant's own careers host.
"eightfold.ai" = 3.0
"careers.micron.com" = 3.0
"careers.qualcomm.com" = 3.0
"careers.appliedmaterials.com" = 3.0
"apply.careers.microsoft.com" = 3.0

# Threads that list boards at once (#158), per ATS; `default` is every ATS not named here (1 to 16 each). Spacing per
# host and the breaker still hold across all of them, so more threads never mean more requests a second to one host.
[workers]
default = 2
greenhouse = 8  # #251 (was 6); host spacing still caps requests a second
ashby = 8  # #251 (was 4)
lever = 1
workable = 1

# Readers switched off (#46), each with the reason. A board on one of these ATSs is never read, probed or slug-probed,
# and its state, postings and decisions stay as they are; no request goes to the ATS's host. Deleting a line turns
# that reader back on. A name that is not one of the crawler's readers fails at load.
[ats_off]
smartrecruiters = "robots.txt on api.smartrecruiters.com allows only LinkedInBot (checked 2026-10-23)"
pinpoint = "robots.txt on {tenant}.pinpointhq.com is Disallow: / (checked 2026-10-23)"

# A big board with few US engineering jobs is read at most every interval_s seconds (#152): at least min_open open
# postings, under max_share of them US engineering (lane engineering, not outside the US), and none of those at his
# level (or with no stated level) first seen in the last quiet_days. interval_s lies between floor_s and ceiling_s.
# A company on today's plan is still read at the floor.
[big_board]
min_open = 200
max_share = 0.10
quiet_days = 30
interval_s = 86400

# Speed tiers (#251, #9 job board ruling 2026-11-12 point 6). A board on one of `ats` (one request a read) waits
# `hot_s` after a good read while a job at his level (engineering, a software role, not outside the US, fit or level
# not stated) was first seen there in the last `hot_days`; `dead_s` once nothing new came for `dead_days`; `warm_s`
# otherwise. Only the next read moves (the stored interval stays the normal one); error backoff and the big_board day
# still apply. Boards on other ATSs keep floor_s to ceiling_s until their newest-first reads land.
[tiers]
hot_s = 900
warm_s = 3600  # 1 hour (2026-11-13, his call after the sanity check; was 2 hours)
dead_s = 86400
hot_days = 90
dead_days = 90
ats = ["greenhouse", "ashby", "lever", "workable", "rippling", "breezy", "recruitee", "jazzhr", "bamboohr",
       "teamtailor", "pinpoint", "smartrecruiters"]
# Head reads (#251 part 2): a hot board here waits hot_s and is checked with one newest-first request (Workday page 1,
# Oracle sorted by posting date) until its normal interval since the last full read has passed; then a full read.
head_ats = ["workday", "oracle_orc"]
