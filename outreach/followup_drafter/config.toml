# The follow-up drafter's settings (#142). It drafts each follow-up due by the next business day through his Claude
# Code seat (claude -p, no API key) and saves it with the MCP tools' own code, so every draft gets the #9 checks. He
# approves each one in the Outbox; the job never approves or sends.

[drafter]
# On: `python -m outreach.followup_drafter run` drafts what is due. false makes it print "is off" and exit 0, with no
# call and no write.
enabled = true
# The model, through his seat. These are emails in his name, so the strongest writer.
model = "claude-opus-5-5"
# Follow-ups drafted in one run, at most (each is one call, two when the first draft has a block).
max_per_run = 40

[run]
call_timeout_s = 300
# Failed calls in a row (not a session limit or a login problem) before the run stops.
max_consecutive_failures = 3
# Lower-case text in the CLI's own error output that means "the session ran out" or "not signed in": stop cleanly.
session_limit_patterns = ["usage limit", "session limit", "limit reached", "resets at"]
auth_patterns = ["not logged in", "please run /login", "authentication", "invalid api key", "oauth token"]
