# The golden set for `python -m outreach.judge eval`: verdicts from a web research pass on 28 companies (2026-10-26,
# outreach-scratch/design/research-A.md, -B.md and -C.md), each with how sure the verdict is, in percent. yes: a
# company he should reach; no: one he should not; maybe: not counted in the yes/no agreement, only in the rank
# correlation (as 0). A company is found by one of its domains first, else by its name.

[[company]]
name = "Sim"
domains = ["sim.ai"]
verdict = "yes"
confidence = 70

[[company]]
name = "Metaview"
domains = ["metaview.ai"]
verdict = "yes"
confidence = 65

