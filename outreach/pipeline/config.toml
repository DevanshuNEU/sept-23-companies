# The SimplifyJobs feed poll's settings (#153). The poll is one conditional GET per crawl tick; Knock keeps what it
# needs from the list to measure itself and never shows a listing as a job.

[simplify]
# The listing file. A change here is a change of feed, not of a setting.
url = "https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json"
# Listings in any other category are dropped (hardware, quant, product). Names are the feed's own.
categories = ["Software", "Software Engineering", "AI/ML/Data", "Data Science, AI & Machine Learning"]
# false skips the poll: no request, no write, no streak change.
enabled = true

# Staffing firms (#257, #9 job board ruling 2026-11-12 point 3). A company is a known staffing firm, and its postings
# are on no tab and in no count, when its name is on `known` (case blind), its name has one of `name_words`, or at
# least `client_min` of its open engineering postings, and at least `client_share` of them, open with client wording
# (the rules' `for_client`). Read at list time: adding a firm here needs no rebuild.
[staffing]
known = [
  "Raydar", "True Talent Solutions Partners", "Pragmatike", "DistantJob", "OnHires", "Lavendo", "Bee Genius",
  "CodeRoad",
  # 2026-11-13, his call: recruiting platforms that post for clients
  "Clera", "Weekday AI",
]
# Only words that name a staffing business outright: "placement" or "search partners" also name product companies
# (Placements.io), so they are left out.
name_words = ["staffing", "recruiting", "recruitment", "talent solutions"]
client_min = 3
client_share = 0.5
