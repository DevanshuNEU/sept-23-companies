# Every number in the daily people plan (#15). Starting values: the owner's calls except where marked.

[linkedin]
plan_quota = 150              # #9: the system's share of requests in any 7 days, counted by context.source = 'plan'
hard_total = 200              # #9: every request in any 7 days, his own included (LinkedIn's limit); wins when lower
rotate_days = 14              # #9: days of no answer after a company's wave before it may get anyone new
rotate_top_n = 150            # a stale company rotates only while it is in the top this many of the laned list
max_people_per_company = 8    # #9 (2026-10-26): up to 8 people per company over time, across its waves

[queue]
# Today is a queue of companies (#9 company-first ruling, 2026-10-26). He finds the people on LinkedIn himself and
# sends one wave of up to requests_per_company requests per company, then the company waits linkedin.rotate_days.
# The day's size: min(companies_per_day, floor(remaining / requests_per_company)), where remaining is what the
# 7-day windows above have left (plan_quota and hard_total, whichever is lower). A heavy day lowers the next ones;
# nothing catches up. This section is the one source for the day's size and the wave (it replaced
# linkedin.per_day and route.wave_size).
companies_per_day = 8         # #9: 150 a week over 5 weekdays is 30 a day, at about 4 people per company
requests_per_company = 4      # #9: one wave of up to 4 people per company
# Top picks (2026-10-26, the owner's spec). Up to fresh_slots of the day's companies are kept for a NEW opening: an
# early career role (new grad, early career, SWE I, or an open level that asks 2 years or fewer) first seen or posted
# within fresh_hours that clears the visa gate. Not now on a pick keeps the company out of the picks for
# pass_cooldown_days, or until a new qualifying opening appears after the pass; it is never a no-go. The bench
# ("More options") shows up to bench_size more companies.
fresh_slots = 3               # of companies_per_day; 0 turns the fresh lane off
fresh_pool_top_n = 300        # the quality floor: only the top this many of the stored ranking may take the lane
fresh_hours = 72
pass_cooldown_days = 14
bench_size = 12

[lanes]
role = ["level_role", "intern_junior"]   # the 80% share
reason = ["reason_no_role"]              # the 20% share
fill = ["any_us_role"]                   # only fills slots the other two cannot
role_share = 0.8
reason_share = 0.2

[email]
start_limit = 20              # #9: the first day's send limit
rows_max = 15
people_per_company = 2        # #9
hn_post_days = 90             # same as ranking
# Email fit and the email lane (2026-10-27, outreach/plan/email_fit.py). It only flags and lists companies: he finds
# the people, Claude drafts, he approves in the Outbox, the sender sends inside the ramp (outreach/sending/config.toml,
# not changed here). A company can be emailed when its website domain is on file (an address pattern needs it), its
# best size is at or under email_max_headcount (no size on file is fine: the size gate already passed it), and no
# no-go, pause, reply, full wave or people_per_company emailed people stands in the way. The lane adds up to
# email_companies_per_day such companies a day beyond today's picks, by the stored ranking; 0 turns it off.
email_max_headcount = 200     # his call to make; the size gate (#9) hides over 300
email_companies_per_day = 6

[plan]
timezone = "America/New_York"
scan_limit = 400
board_read_top_n = 30
roll_forward_days = 5
# Company first (#9, 2026-10-26): Devanshu finds the people on LinkedIn himself, so the plan proposes company rows
# only: no person rows, no email rows, no notes. Carry-forward, rotation and the capacity windows stay as they are.
# True brings the person and email rows back (the code stays until it is deleted).
propose_people = false

[people]
founder_max_headcount = 25
employer_fresh_days = 30      # playbook v3.5
generic_mailboxes = ["info", "hello", "contact", "support", "sales", "press", "admin", "team", "careers", "jobs", "hr", "recruiting", "noreply", "no-reply"]

[prepare]
# Company first (#9, 2026-10-26): the night step that finds people and drafts their notes is off. When false the
# job prints "prepare is off", exits 0 and touches nothing: no claude call, no job run, no event. This is not the
# deny-rule switch below, which only records that the LinkedIn deny check was done.
enabled = false
multiple = 2.0                # design 10
retry_days = 7
max_candidates = 2
model = "claude-sonnet-5-5"
call_timeout_s = 600
max_consecutive_failures = 2
# Until the reader plan (#32) has its own lists, these two stand.
session_limit_patterns = ["usage limit", "rate limit"]
auth_patterns = ["not logged in", "please run /login"]
schema_version = 1
# The prepare step does nothing (one line, exit 0) until this is true: it is the one-time check that the LinkedIn deny
# rule takes effect on his seat (the runbook in docs/README.md and outreach/plan/claude_run.py). Checked 2026-10-25 with
# the exact command `claude_command` builds and example.com in place of linkedin.com: `https://example.com` and
# `https://uk.example.com` both came back DENIED with 0 web fetches (so the `*.` pattern is honoured). Set it back
# to false only if that check no longer holds; `enabled` above is the on and off switch.
deny_rule_checked = true

[note]
max_chars = 300               # #9 (2026-10-26): his Career Premium seat allows 300; the loader accepts 100 to 300
max_links = 2
banned_scopes = ["both", "dm"]
# Regexes, case-insensitive: the playbook's connection-note prose bans.
extra_banned = ["can you refer", "could you refer", "would you refer", "refer me", "ms from northeastern", "finishing my ms", "graduating from northeastern", "mutual connection"]
banned_path = "~/Desktop/DevVault/job-search/outreach/banned_phrases.txt"

[route]
# How a person Devanshu found is reached (outreach/plan/route.py). #9's rules hold whatever these say: email only
# to a published or verified address, never guessed; the sender's ramp, 3 a day per company and 60 minutes apart.
reach_kinds = ["engineer", "manager", "founder"]   # anyone else is "find someone else" (advice: he may still send)
# His preference (2026-10-26), not measured yet: plain engineers in the role first. It only orders people inside one
# company; it never hides a person or a company and never touches company ranking.
prefer_ic_in_role = true
founder_title_words = ["founder", "co-founder", "cofounder", "ceo", "chief executive"]
recruiter_title_words = ["recruiter", "recruiting", "recruitment", "talent", "sourcer", "sourcing"]
outside_title_words = ["sales", "marketing", "account executive", "business development", "customer success", "finance", "legal", "people operations", "human resources"]
manager_title_words = ["manager", "head of", "director", "vp", "vice president", "cto", "chief technology"]
engineering_words = ["engineer", "engineering", "software", "developer", "swe", "sde", "programmer", "platform", "infrastructure", "backend", "frontend", "full stack", "data", "ml", "ai", "technical", "technology", "devops", "sre", "member of technical staff"]
ic_title_words = ["engineer", "developer", "swe", "sde", "programmer", "member of technical staff", "architect", "devops", "sre"]
senior_title_words = ["senior", "sr", "staff", "principal"]
lead_title_words = ["lead", "manager", "head", "director", "vp", "vice president", "chief", "cto", "ceo", "founder", "co-founder", "cofounder"]
title_exceptions = ["member of technical staff"]   # read as a plain IC, not as staff

[bridge]
# The terminal bridge (outreach/mcp/tools/bridge.py). contacted.txt is frozen history (#9): read only, to report
# lines the store lacks. A missing file is fine.
contacted_txt = "~/Desktop/DevVault/job-search/outreach/contacted.txt"
log_back_days = 3             # log_sent takes a request sent today or up to this many days back
