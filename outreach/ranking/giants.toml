[[group]]
parent = "JPMorgan Chase"
names = ["JPMorgan Chase", "JPMorgan"]  # "J.P. Morgan" has the same key as JPMorgan

[[group]]
parent = "Lucid Group"
names = ["Lucid Motors", "Lucid Group"]

