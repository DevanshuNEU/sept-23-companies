# The giants list (size gate, 2026-10-27): companies far over the 300 people cap, each under its parent. A company
# on it is hidden as over size (`over_size`, the No-go page's "hidden by the ranker" list) even with no size fact,
# so it is never a Today pick, a fresh lane pick or a bench entry. Nothing is deleted and no status changes.
#
# Matching: each name goes through `outreach.store.writes.name_key` (case, spaces, punctuation and a trailing Inc,
# LLC, Ltd, Corp, Co or GmbH do not matter) and must equal the key of the company's name, one of its name aliases
# or one of its name keys, across its merged family. Only whole names match: "Lucid Motors" never matches
# "Lucid Computing".
#
# To put a company back: set its size by hand (a locked size at or under 300 wins over this list), or take its name
# out of this file. A change here is a new ranker version, so the next rank run applies it.
#
# Only list a name that is clearly over 300 people and cannot be mistaken for a small company of the same name.
# Staffing firms are left to the staffing_risk signal unless they are giants in their own right (ALTEN).

[[group]]
parent = "Amazon"
names = ["Amazon", "Amazon Web Services", "AWS", "Twitch", "Whole Foods Market", "Zoox", "Audible", "Zappos",
         "IMDb", "One Medical"]

[[group]]
parent = "Alphabet"
names = ["Alphabet", "Google", "YouTube", "DeepMind", "Google DeepMind", "Waymo", "Verily", "Fitbit", "Mandiant"]

[[group]]
parent = "Meta"
names = ["Meta", "Meta Platforms", "Facebook", "Instagram", "WhatsApp", "Oculus"]

[[group]]
parent = "Microsoft"
