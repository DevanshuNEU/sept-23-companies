# OFLC prevailing wages for software developers (SOC 15-1252), annual dollars, levels I to IV.
# To add an area, append an [[area]] row built from ALC_Export.csv (hourly x 2080) and list the principal cities of
# the area's counties from Geography.csv as lower case aliases. An alias belongs to one area only.
# An alias counts only when the posting also names one of the area's states (`states`, two letter codes), so
# "Everett, MA" is not Seattle and a bare "Boston" is not read. `metro` holds names that are unambiguous on their
# own ("NYC", "Bay Area", "Greater Boston"). A location naming another state or a non-US country is unlisted.
# A change to this file is a new ranker version (see version.py).
soc = "15-1252"
wage_year = "2026-27"
source = "OFLC_Wages_2026-27 ALC_Export.csv, hourly x 2080"

# San Jose-Sunnyvale-Santa Clara, CA (41940): Santa Clara and San Benito counties.
[[area]]
name = "San Jose"
states = ["CA"]
metro = ["silicon valley"]
aliases = ["san jose", "sunnyvale", "santa clara", "mountain view", "palo alto", "cupertino", "milpitas",
           "los gatos", "los altos", "campbell", "saratoga", "morgan hill", "gilroy", "hollister"]
level1 = 152797
level2 = 187075
level3 = 221374
level4 = 255653

# San Francisco-Oakland-Hayward, CA (41860): Alameda, Contra Costa, Marin, San Francisco and San Mateo counties.
[[area]]
name = "San Francisco"
states = ["CA"]
metro = ["bay area", "san francisco bay area", "sf bay area"]
aliases = ["san francisco", "south san francisco", "oakland", "berkeley", "emeryville", "alameda", "fremont",
           "hayward", "san leandro", "pleasanton", "walnut creek", "san mateo", "redwood city", "menlo park",
           "foster city", "burlingame", "daly city", "san rafael"]
level1 = 137093
level2 = 165131
level3 = 193149
level4 = 221187

# Boston-Cambridge-Newton, MA-NH (14460): Middlesex, Norfolk, Suffolk, Essex and Plymouth counties and Rockingham, NH.
[[area]]
name = "Boston"
states = ["MA", "NH"]
metro = ["greater boston", "boston metro"]
aliases = ["boston", "cambridge", "somerville", "waltham", "watertown", "brookline", "quincy", "woburn", "lexington",
           "framingham", "lynn", "marlborough"]
level1 = 114275
level2 = 138237
level3 = 162198
level4 = 186160

# Seattle-Bellevue-Everett, WA (42660): King and Snohomish counties.
[[area]]
name = "Seattle"
states = ["WA"]
metro = ["greater seattle", "seattle metro", "puget sound"]
aliases = ["seattle", "bellevue", "redmond", "kirkland", "everett", "renton", "bothell", "issaquah"]
level1 = 111613
level2 = 143104
level3 = 174595
level4 = 206086

# New York-Newark-Jersey City, NY-NJ-PA (35620): the five boroughs and the nearby New Jersey cities.
[[area]]
name = "New York"
states = ["NY", "NJ"]
metro = ["nyc", "new york city", "greater new york", "new york metro"]
aliases = ["new york", "manhattan", "brooklyn", "queens", "bronx", "staten island",
           "long island city", "jersey city", "hoboken", "newark", "white plains", "yonkers"]
level1 = 109845
level2 = 137717
