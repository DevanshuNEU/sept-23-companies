# data.js sizeWhy and head wording: a size written with one of these is a guess, not an estimate
size_guess_words = [
  "guess", "uncertain", "est.",
]
# Wording that measures visa filings, not headcount (LCA counts are sponsorship evidence: audit section 1). A text
