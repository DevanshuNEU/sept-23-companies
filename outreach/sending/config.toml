# The sending engine's numbers (#14). Every value comes from issue #9 or the plan's "Decisions" section.
# Keep each key on one line: tests replace single lines of this file.

# Display name on every sender account.
from_name = "Devanshu Chicholikar"

# The sender's day (send_day.day, daily counts) is this zone's date.
day_tz = "America/New_York"

# A day is clean when bounces are under 2% over the last 3 days (#9).
clean_bounce_rate = 0.02
bounce_days = 3

# Hard block on the bounce rate (#9 multi-sender ruling, 2026-11-12): 2% of an account's last 100 first emails, once 30 are sent, pauses that account.

# Hard block: two "asked to stop" tags within 7 days.
stop_replies_hard = 2
stop_replies_days = 7

# Window (#9 multi-sender ruling, 2026-11-12): weekdays (0 is Monday), 08:00 to 15:00 recipient local time, both ends
# inclusive.
window_start = "08:00"
window_end = "15:00"
weekdays = [0, 1, 2, 3, 4]
# Dates ("2026-11-26") that are not business days: Thanksgiving and the day after, and the Christmas and New Year days.
holidays = ["2026-11-26", "2026-11-27", "2026-12-24", "2026-12-25", "2026-12-31", "2027-01-01"]

# People per company: a company's band (below) sets its first emails a day and its gap. These three keys are the
# default band, for a company with no size on file and no sign of being big (#9, 2026-11-12, #229): 2 first emails a
# day (a follow-up takes no slot, 2026-10-31); every email to it, follow-ups too, 60 minutes plus
# per_company_gap_jitter_minutes apart.
per_company_daily = 2
per_company_gap_minutes = 60

# Company size bands (#9 company size pacing ruling, 2026-11-12, #229). One column per key: band n holds companies of
# up to size_band_up_to[n] people (the last band, everyone above the last bound). For each band: first emails a day,
# the gap's floor in minutes and up to how many minutes more (a different amount after each send).
size_band_up_to = [100, 200, 500, 1000]
size_band_daily = [2, 4, 5, 8, 15]
size_band_gap_minutes = [60, 60, 45, 30, 20]
size_band_gap_jitter_minutes = [60, 30, 30, 20, 15]
# A company with no size on file that the job list guesses is big (an active Workday or Oracle board, or more than 50
# open US postings) takes this band (1 is the first): 4, the 501 to 1,000 band.
size_guessed_big_band = 4

# Spread pacing (#9 multi-sender ruling, 2026-11-12). An account's gap after a send is the minutes left in its window
# over the sends it has left today, times a random factor from spread_jitter, clipped to spread_gap_minutes, so a day
# of 15 spreads across the window and does not go out in the first half hour. The sender ticks every 2 minutes, so a
# gap lands on the next tick. Now and then (break_chance) the gap is a real break of break_minutes instead.
spread_jitter = [0.6, 1.4]
spread_gap_minutes = [2, 45]
break_chance = 0.04
break_minutes = [10, 25]
# The next send is one of the first pick_pool ready messages, not strictly the oldest.
pick_pool = 5
# The first send of a day starts up to this many minutes after the window opens (a different offset each day).
day_start_jitter_minutes = 25
# A company's gap is per_company_gap_minutes plus up to this many (a different amount after each send).
per_company_gap_jitter_minutes = 60

# Follow-ups (#9 multi-sender ruling, 2026-11-12): one, 7 business days after the first email (message.seq allows up to 4).
followup_business_days = [7]
# A follow-up nobody approved or skipped this many business days after it was due lapses (planned or drafted).
followup_lapse_business_days = 5
# An open touch with nothing queued closes no_reply this many business days after its last sent message.
close_after_business_days = 7

# A send in doubt waits this long before the sender looks for it in Sent.
reconcile_after_minutes = 10
# At most 2 claims per message: send_unknown -> failed -> approved is the only path to a second attempt.
max_send_attempts = 2
# Without a usable history cursor, read the threads of touches sent in the last 45 days once.
rethread_days = 45
# The most inbound messages read per tick.
inbound_meta_cap = 200

# The old mailer's launchd job; the new sender refuses to claim while it is loaded.
old_sender_label = "com.devanshu.outreach-mail-sender"
# The sender deletes its own ok no-op job_run rows older than this.
prune_noop_after_days = 14

# Sender accounts (#9 multi-sender ruling, 2026-11-12). One block per account, in this order; keep each key on one
# line. `lane` is the audience the account serves ("sponsor" or "general", unset for none), at most one sending account
# per lane. `sends = false` keeps an account out of the sender. Each account has its own ramp: start, step, floor and
# ceiling (the ceiling stays at or under the hard 200). The first block is the old sender; it no longer sends.
# compat until Task A10: SendConfig.from_address reads the first block's address.
# These blocks stay last: a TOML key after a [[account]] header would belong to that block.
[[account]]
address = "devanshurajesh@gmail.com"
kind = "gmail"
sends = false
ramp_start = 15
ramp_step = 3
ramp_floor = 15
ramp_ceiling = 40

[[account]]
address = "devanshuchi9@gmail.com"
kind = "gmail"
lane = "general"
sends = true
ramp_start = 15
ramp_step = 3
ramp_floor = 15
ramp_ceiling = 40

# Sends through Mail.app on the Northeastern account. Off until Phase B.
[[account]]
address = "chicholikar.d@northeastern.edu"
kind = "mailapp"
mailapp_account = "Exchange"
lane = "sponsor"
sends = false
ramp_start = 15
ramp_step = 3
ramp_floor = 15
ramp_ceiling = 60
