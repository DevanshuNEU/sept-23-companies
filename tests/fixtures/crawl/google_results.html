<script class="ds:1">AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["89657015277626054","Data Center Technician I","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckfEUwUoxw5SbtWQmtfNnieytpnYCyltBF-Km36slFf8sEjsA9",[null,"<ul>\n<li>Deploy and operate new data center infrastructure across projects or functions.<br></li>\n<li>Report issues and follow data center procedures to troubleshoot and diagnose straightforward issues with equipment or infrastructure as they arise, and applying the resources needed to resolve identified issues.<br></li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Experience with performing component-level repairs and troubleshooting on technical equipment.</li>\n<li>Ability to lift/move 50lb (23kg) of equipment as required and ability to exert yourself physically over extended periods of time, including frequent bending, kneeling, climbing, pushing/pulling and lifting.<br></li>\n<li>Must have the ability to work non-standard hours, including working weekends, night shifts, holidays and on shift-based schedules as required.</li>\n<li>Must be available to travel to support business priorities as operationally required.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>1 year of experience diagnosing and troubleshooting one of the following: operating systems and computer/server hardware or networking protocols. <br></li>\n<li>Experience with performing component-level repairs and troubleshooting on IT equipment or in a similar role (e.g., Systems Administration, Network Deployment Engineer, Help Desk Technician, etc.).</li>\n<li>Ability to collaborate and partner with teams to overcome challenges.<br></li>\n<li>Ability to adapt to changes in a dynamic work environment. <br></li>\n<li>Ability to understand, and to effectively execute, frequent verbal and written instructions.<br></li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Bridgeport, AL, USA",["Bridgeport, AL 35740, USA"],"Bridgeport","35740","AL","US"]],[null,"<p>Google isn't just a software company. The Hardware Operations team is responsible for monitoring the state-of-the-art physical infrastructure behind Google's powerful search technology. As an Operations Technician, you'll install, configure, test, troubleshoot and maintain hardware (like servers and its components) and server software (like Google's Linux cluster). You'll also take on the configuration of more complex components such as networks, routers, hubs, bridges, switches and networkin"],null,[1794400989,792000000],[1794570162,765000000],[1794570162,794000000],[null,"This role is not eligible for U.S. immigration sponsorship. Candidates must be able to work 100% onsite."],null,null,[null,""],[null,"<ul>\n<li>Experience with performing component-level repairs and troubleshooting on technical equipment.</li>\n<li>Ability to lift/move 50lb (23kg) of equipment as required and ability to exert yourself physically over extended periods of time, including frequent bending, kneeling, climbing, pushing/pulling and lifting.<br></li>\n<li>Must have the ability to work non-standard hours, including working weekends, night shifts, holidays and on shift-based schedules as required.</li>\n</ul>"],1],["84385896404525766","RTL Design Engineer, Google","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckTxyfk5s0bT6tMA6qkr6ya4vTLtbiftFZoYX_Lp9QRN0EjsA9",[null,"<ul>\n<li>Create and review clock control subsystem's design micro-architecture specifications.</li>\n<li>Develop SystemVerilog RTL to implement logic for ASIC products according to established coding and quality guidelines.</li>\n<li>Work with architecture and power teams to evaluate features and their impact.</li>\n<li>Work with Design Validation (DV) teams to create test plans to verify and debug design RTL.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree in Electrical Engineering, Computer Engineering, Computer Science, a related field, or equivalent practical experience.</li>\n<li>Experience in SystemVerilog for creating microarchitecture specifications and synthesizable RTL.</li>\n<li>Experience using Python, Tcl, or Perl for automating design tasks and data analysis.</li>\n<li>Experience with industry-standard EDA tools for simulation, synthesis, and power analysis.</li>\n<li>Experience in ASIC RTL design, with a focus on clocking, reset, or timing-critical RTL development.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master's degree or PhD in Electrical Engineering, Computer Engineering or Computer Science, with an emphasis on computer architecture.</li>\n<li>2 years of experience with high-performance ASIC design in Phase-Locked Loop, Frequency-Locked Loop, and Delay-Locked Loop integration.</li>\n<li>Experience implementing clock skipping, dynamic voltage and frequency scaling (DVFS), and fine-grained clock gating for low-power SoC optimization.</li>\n<li>Experience utilizing AI productivity tools to streamline individual, business or development workflows.</li>\n<li>Proficiency in Python or Perl for automating design scripts and analyzing clock-tree data.</li>\n<li> Understanding of clock distribution challenges, including jitter, skew management, and duty-cycle distortion.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["Sunnyvale, CA, USA",["Sunnyvale, CA, USA"],"Sunnyvale",null,"CA","US"]],[null,"<p>In this role, you\u2019ll work to shape the future of AI/ML hardware acceleration. You will have an opportunity to drive cutting-edge TPU (Tensor Processing Unit) technology that powers Google's most demanding AI/ML applications. You\u2019ll be part of a team that pushes boundaries, developing custom silicon solutions that power the future of  Google's TPU. You'll contribute to the innovation behind products loved by millions worldwide, and leverage your design and verification expertise to verify comp"],[2,3,4],[1794562739,314000000],[1794562739,314000000],[1794562739,384000000],[null,"In most instances, this position requires in-person interviews as part of the hiring process."],null,null,[null,""],[null,"<ul>\n<li>Bachelor's degree in Electrical Engineering, Computer Engineering, Computer Science, a related field, or equivalent practical experience.</li>\n<li>Experience in SystemVerilog for creating microarchitecture specifications and synthesizable RTL.</li>\n<li>Experience using Python, Tcl, or Perl for automating design tasks and data analysis.</li>\n<li>Experience with industry-standard EDA tools for simulation, synthesis, and power analysis.</li>\n</ul>"],1],["109116638069957318","Software Engineer II, Early Career","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckdD7bI3yruUJ3UQ00LBwPqRIKrnSlHSuAh1VAfF9ohxgEjsA9",[null,"<ul>\n<li>Design, develop, test, deploy, maintain, and improve software.</li>\n<li>Manage project priorities, deadlines, and deliverables.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>1 year of experience with software development in one or more programming languages (e.g., Python, C, C++, Java, JavaScript) in an industry setting.</li>\n<li>Experience working with one or more of the following: Web or Mobile Application Development, Unix/Linux environments, Distributed and Parallel Systems, Machine Learning or AI, Information Retrieval, Natural Language Processing, Networking, Developing Software Systems, or Security Software Development.</li>\n<li> Experience utilizing AI productivity tools to streamline business or development workflows.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master's degree in Computer Science or a related technical field.</li>\n<li>Experience developing acce , natural language proces"],[2,3],[1793603262,44000000],[1793617677,239000000],[1793617681,202000000],[null,"<div>The application window will be open until at least\u00a0<b>November 27th, 2026</b>. This opportunity will remain online based on business needs which may be before or after specified date.</div><div><br></div><div>During the application process, you will be able to indicate any additional preferred working locations. We encourage all qualified individuals to apply, and we will consider your skills and interests for other open positions across our available locations.</div><div><br></div><div>Applicants in the County of Los Angeles: Qualified applications with arrest or conviction records will be considered for employment in accordance with the Los Angeles County Fair Chance Ordinance for Employers and the California Fair Chance Act.</div><div><br></div><div>In most instances, this position requires in-person interviews as part of the hiring process<br></div><div><br></div><div>In accordance with Washington state law, we are highlighting our comprehensive benefits package, which is available to all eligible US based employees. Benefits for this role include:<br><ul><li>Health, dental, vision, life, disability insurance</li><li>Retirement Benefits: 401(k) with company match</li><li>Paid Time Off: 20 days of vacation per year, accruing at a rate of 6.15 hours per pay period for the first five years of employment</li><li>Sick Time: 40 hours/year (increased to 69 hours/year for Seattle) including 5 discretionary sick days per instance </li><li>Maternity Leave (Short-Term Disability + Baby Bonding): 28-30 weeks</li><li>Baby Bonding Leave: 18 weeks</li><li>Holidays: 13 paid days per year</li></ul></div>"],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: <b>Mountain View, CA, USA; Kirkland, WA, USA; Los Angeles, CA, USA; Madison, WI, USA; New York, NY, USA; Palo Alto, CA
