<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outreach</title>
    <script>
      // Sets the dark class before the first paint, by the same rules as src/theme/theme.tsx:
      // a stored 'light' or 'dark' wins, anything else follows the system.
      (function () {
        var theme = 'system';
        try {
          theme = window.localStorage.getItem('outreach.theme') || 'system';
        } catch (e) {}
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
